[project]
name = "fnos-mcp"
version = "0.4.2"
description = "MCP server wrapping trim-cli (fnos-skill) to manage fnOS NAS: files, photos, apps, Docker, downloads, logs, monitoring, storage, users and Baidu Netdisk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muwei-TA" }]
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
fnos-mcp = "fnos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fnos_mcp"]
